name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: '服务端 HTTPS 地址（留空则使用 web/capacitor.config.json 中的默认值）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Override server URL if provided
        if: ${{ inputs.server_url != '' }}
        working-directory: web
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server.url = process.env.SERVER_URL;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
        env:
          SERVER_URL: ${{ inputs.server_url }}

      - name: Add Android platform, version & permissions
        working-directory: web
        run: |
          npx cap add android
          npx cap sync android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.CAMERA",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("<application", `<uses-permission android:name="${perm}" />\n    <application`);
              }
            }
            // 海报「保存到相册」：Android 11+ 无需权限；Android 10 及以下需要写存储权限 + 旧版存储模式
            if (!xml.includes("WRITE_EXTERNAL_STORAGE")) {
              xml = xml.replace("<application", `<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application`);
            }
            if (!xml.includes("requestLegacyExternalStorage")) {
              xml = xml.replace(/<application(\s)/, "<application android:requestLegacyExternalStorage=\"true\"$1");
            }
            fs.writeFileSync(p, xml);

            const v = JSON.parse(fs.readFileSync("../version.json", "utf8"));
            const gp = "android/app/build.gradle";
            let g = fs.readFileSync(gp, "utf8");
            g = g.replace(/versionCode\s+\d+/, `versionCode ${v.versionCode}`);
            g = g.replace(/versionName\s+"[^"]+"/, `versionName "${v.version}"`);
            fs.writeFileSync(gp, g);

            // 为 Android WebView 挂载 DownloadListener：遇到 APK 等可下载文件时直接交给系统浏览器下载
            const mainAct = "android/app/src/main/java/com/shunlu/app/MainActivity.java";
            fs.writeFileSync(mainAct, [
              "package com.shunlu.app;",
              "",
              "import android.content.Intent;",
              "import android.net.Uri;",
              "import android.os.Bundle;",
              "import com.getcapacitor.BridgeActivity;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "    @Override",
              "    public void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        if (getBridge() != null && getBridge().getWebView() != null) {",
              "            getBridge().getWebView().setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {",
              "                try {",
              "                    startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));",
              "                } catch (Exception ignored) {}",
              "            });",
              "        }",
              "    }",
              "}",
              ""
            ].join("\n"));
          '

      - name: Generate Android launcher icons from logo.svg
        run: |
          node -e '
            const sharp = require("sharp");
            const fs = require("fs");
            const path = require("path");
            const svg = fs.readFileSync("web/public/logo.svg");
            const res = "web/android/app/src/main/res";
            const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
            (async () => {
              for (const [d, s] of Object.entries(sizes)) {
                const dir = path.join(res, "mipmap-" + d);
                fs.mkdirSync(dir, { recursive: true });
                await sharp(svg, { density: 300 }).resize(s, s).png().toFile(path.join(dir, "ic_launcher.png"));
                await sharp(svg, { density: 300 }).resize(s, s).png().toFile(path.join(dir, "ic_launcher_round.png"));
                await sharp(svg, { density: 300 }).resize(Math.round(s * 1.5), Math.round(s * 1.5)).png().toFile(path.join(dir, "ic_launcher_foreground.png"));
              }
              const bgXml = path.join(res, "values/ic_launcher_background.xml");
              if (fs.existsSync(bgXml)) {
                fs.writeFileSync(bgXml, `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#1677FF</color>\n</resources>\n`);
              }
            })();
          '

      # 正式签名：配置了 ANDROID_KEYSTORE_BASE64 等 secrets 时打 release 包（固定签名，可覆盖升级、不可调试）；
      # 未配置时回退为 debug 包（每次构建签名不同，用户需卸载旧版才能安装）
      - name: Build APK (release-signed when keystore secrets exist)
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SHUNLU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHUNLU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHUNLU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shunlu-release.jks"
            export SHUNLU_KEYSTORE_PATH="$RUNNER_TEMP/shunlu-release.jks"
            node -e '
              const fs = require("fs");
              const gp = "app/build.gradle";
              let g = fs.readFileSync(gp, "utf8");
              const signing = `
              signingConfigs {
                  release {
                      storeFile file(System.getenv("SHUNLU_KEYSTORE_PATH"))
                      storePassword System.getenv("SHUNLU_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("SHUNLU_KEY_ALIAS")
                      keyPassword System.getenv("SHUNLU_KEY_PASSWORD")
                  }
              }
              buildTypes {`;
              if (!/buildTypes\s*\{/.test(g) || !/release\s*\{/.test(g)) throw new Error("build.gradle 结构不符合预期");
              g = g.replace(/buildTypes\s*\{/, signing.trim());
              g = g.replace(/(buildTypes\s*\{\s*release\s*\{)/, "$1\n            signingConfig signingConfigs.release");
              fs.writeFileSync(gp, g);
            '
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../shunlu.apk
            rm -f "$RUNNER_TEMP/shunlu-release.jks"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_* secrets，回退为 debug 签名（每次构建签名不同，无法覆盖升级）"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../shunlu.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunlu-apk
          path: shunlu.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -e 'console.log(require("./version.json").version)')
          gh release delete apk-latest --yes 2>/dev/null || true
          git push origin :refs/tags/apk-latest 2>/dev/null || true
          gh release create apk-latest shunlu.apk \
            --title "顺路 Android APK v${VER}（最新构建）" \
            --notes "自动构建的 Android 安装包 v${VER}，直接下载 shunlu.apk 安装体验。官网：https://www.shunlu.cc.cd"

      - name: Sync APK directly to production website
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            scp -o StrictHostKeyChecking=no shunlu.apk root@"$DEPLOY_HOST":/opt/shunlu/web/dist/shunlu.apk
          fi
